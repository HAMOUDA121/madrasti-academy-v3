<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MADRASTI Academy{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
    <header class="bg-white border-b border-slate-200 shadow-sm">
        <nav class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="text-2xl font-black text-indigo-600 tracking-tight">MADRASTI</a>
            <ul class="flex items-center space-x-6 text-sm font-semibold text-slate-600">
                <li><a href="{% url 'ai_tutor' %}" class="hover:text-indigo-600 transition">🤖 Tuteur IA</a></li>
                <li><a href="{% url 'achievements' %}" class="hover:text-indigo-600 transition">🏆 Mes Succès</a></li>
                <li><a href="{% url 'parent_dashboard' %}" class="hover:text-indigo-600 transition">👨‍👩‍👧 Espace Parent</a></li>
                <li><a href="{% url 'teacher_dashboard' %}" class="hover:text-indigo-600 transition">👨‍🏫 Espace Enseignant</a></li>
            </ul>
        </nav>
    </header>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 text-center py-6 text-xs text-slate-400">
        © MADRASTI Academy - Tous droits réservés
    </footer>
</body>
</html>
